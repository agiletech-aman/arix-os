# AI-OS policy. Levels: allow (L0) | ask_once (L1) | confirm (L2) | deny (L3).  Strictest match wins.
default = "deny"            # any operation not listed below

[operations]
read       = "allow"
list_dir   = "allow"
list_trash = "allow"
create     = "allow"
update     = "ask_once"
mkdir      = "allow"
restore    = "allow"
delete     = "confirm"

[[rules]]
paths      = [".env", "*.env", "*.key", "*.pem", "secrets", "secrets/*"]
operations = ["*"]
level      = "deny"
reason     = "protected path"

[limits]
max_content_bytes = 1048576
